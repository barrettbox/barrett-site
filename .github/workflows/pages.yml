name: Deploy GitHub Pages (hub + marketing site)

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build marketing site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _pages
          mkdir -p _pages
          # Apps hub owns the Pages root (ASC privacy/support under /apps/…).
          cp -a hub/. _pages/
          # Product marketing site under /site/ (Astro base=/barrett-site/site).
          mkdir -p _pages/site
          cp -a site/dist/. _pages/site/
          # Avoid shipping hub README as a site page.
          rm -f _pages/README.md
          ls -la _pages
          ls -la _pages/site | head

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # First successful run can enable project Pages (Actions source).
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
